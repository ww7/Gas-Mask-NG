<div id="gm-all-approved-icons">
  <style>
    #gm-all-approved-icons .gm-palettes { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:24px 16px; }

    #gm-all-approved-icons .gm-pair { display:flex; margin-top:6px; }

    #gm-all-approved-icons .gm-bar.gm-normal { background:var(--background); color:var(--foreground); }
    #gm-all-approved-icons .gm-template { display:block; background:currentColor; mask-repeat:no-repeat; mask-size:contain; -webkit-mask-repeat:no-repeat; -webkit-mask-size:contain; }
    #gm-all-approved-icons .gm-16 { width:16px; height:16px; }
    #gm-all-approved-icons .gm-32 { width:32px; height:32px; }
    @media(max-width:500px) { #gm-all-approved-icons .gm-palettes { grid-template-columns:1fr; } }
  </style>
